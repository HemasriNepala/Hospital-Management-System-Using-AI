{% extends "base.html" %}
{% block title %}Reports - Admin{% endblock %}
{% block content %}
<h1 class="page-title"><i class="bi bi-graph-up text-secondary me-2"></i>Basic Reports</h1>
<p class="text-muted simple-text mb-4">Summary of hospital activity.</p>

<div class="row g-4">
  <div class="col-md-4">
    <div class="card shadow-sm text-center">
      <div class="card-body">
        <i class="bi bi-person-badge text-primary display-4"></i>
        <h3 class="mt-2">{{ doctors_count }}</h3>
        <p class="text-muted mb-0">Total Doctors</p>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card shadow-sm text-center">
      <div class="card-body">
        <i class="bi bi-people text-success display-4"></i>
        <h3 class="mt-2">{{ patients_count }}</h3>
        <p class="text-muted mb-0">Total Patients</p>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card shadow-sm text-center">
      <div class="card-body">
        <i class="bi bi-calendar-check text-info display-4"></i>
        <h3 class="mt-2">{{ appointments_count }}</h3>
        <p class="text-muted mb-0">Total Appointments</p>
      </div>
    </div>
  </div>
</div>
<div class="mt-4">
  <a href="{{ url_for('admin_routes.dashboard') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
</div>
{% endblock %}
